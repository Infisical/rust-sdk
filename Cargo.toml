[package]
name = "infisical"
version = "0.1.0"
edition = "2021"
authors = [
  "Daniel H. <daniel@infisical.com>",
  "Andrey L. <andrey@infisical.com>",
]
description = "Official Rust SDK for Infisical"
license = "MIT"
readme = "README.md"
repository = "https://github.com/infisical/rust-sdk"
keywords = ["infisical", "secrets", "sdk", "api"]
categories = ["api-bindings"]
homepage = "https://infisical.com"
include = ["**/*.rs", "Cargo.toml"]

[dependencies]
aws-config = "1.12"
aws-credential-types = "1.3"
aws-sigv4 = "1.5"
aws-smithy-runtime-api = "1.16"
base64 = "0.22"
http = "1.5"
reqwest = { version = "0.12", features = ['json', 'blocking', 'rustls-tls', 'http2'], default-features = false }
serde = { version = "1", features = ['derive'] }
serde_json = "1"
thiserror = "1"
url = "2.5"
urlencoding = "2.1"

[dev-dependencies]
dotenvy = "0.15"
tokio = { version = "1.46", features = ["full"] }
wiremock = "0.6"
